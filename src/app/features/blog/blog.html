<div class="blog-container">

  <div class="blog-header">
    <h1>Latest Blogs</h1>
    <p>Explore our latest articles and tutorials</p>
  </div>

  <div class="blog-post">
    @for (blog of blogs; track blog.id) {
    <article class="blog-card" [routerLink]="['/blog', blog.id]">

      <h2>{{ blog.title }}</h2>

      <p class="description">
        {{ blog.description }}
      </p>

      <div class="blog-meta">
        <span>By {{ blog.author }}</span>
        <span>{{ blog.date }}</span>
      </div>

    </article>

    }
    @empty(){
    <h1>No Records to display </h1>
    }
  </div>

</div>
